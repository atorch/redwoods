[project]
name = "redwoods"
version = "0.1.0"
description = "A map of coastal redwoods - current distribution and natural suitable habitat"
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "awscli>=1.44.78",
    "goes2go>=2023.4.2",
    "netcdf4>=1.7.3",
    "pyproj>=3.7.1",
    "rio-cogeo>=6.0.0",
    "rio-tiler>=7.9.5",
    "pillow>=12.2.0",
    "mercantile>=1.2.1",
]

[dependency-groups]
dev = []
